<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Discord</title>
    <link rel="stylesheet" href="style.css">
    <script src="/socket.io/socket.io.js"></script>
</head>
<body>

    <!-- Modal Login -->
    <div id="login-overlay" class="modal-backdrop">
        <div class="login-card">
            <h2>ยินดีต้อนรับกลับมา!</h2>
            <p>กรอก Discord Bot Token เพื่อเข้าสู่ระบบ Client UI</p>
            <div class="form-group">
                <label>BOT TOKEN</label>
                <input type="password" id="token-input" placeholder="MTAxMjM0NTY3ODkw...">
                <button id="btn-login">เข้าสู่ระบบ</button>
                <div id="login-status" class="error-msg"></div>
            </div>
        </div>
    </div>

    <!-- Main Discord App Layout -->
    <div id="app" class="discord-layout hidden">
        
        <!-- 1. Guilds Sidebar (Leftmost Bar) -->
        <nav class="guilds-bar">
            <div class="guild-item active" id="btn-dm-tab" title="ข้อความส่วนตัว">
                <div class="pill-indicator"></div>
                <div class="guild-icon-wrapper discord-brand-bg">
                    <svg width="28" height="20" viewBox="0 0 127.14 96.36"><path fill="#ffffff" d="M107.7,8.07A105.15,105.15,0,0,0,81.47,0a72.06,72.06,0,0,0,3.36,6.83A97.68,97.68,0,0,0,42.31,6.83,72.37,72.37,0,0,0,45.67,0,105.89,105.89,0,0,0,19.39,8.09C2.79,32.65-1.71,56.6.54,80.21A105.73,105.73,0,0,0,32.71,96.36,77.7,77.7,0,0,0,39.6,85.25a68.42,68.42,0,0,1,10.85-5.18c.91-.32,1.8-.67,2.67-1a7.8,7.8,0,0,1,2.83.6c11.3,5.32,23.82,5.32,35,0a7.8,7.8,0,0,1,2.83-.6c.88.35,1.77.7,2.68,1a68.3,68.3,0,0,1,10.84,5.18,77.53,77.53,0,0,0,6.89,11.1,105.25,105.25,0,0,0,32.19-16.14C129.24,49.2,123.63,25.5,107.7,8.07ZM42.45,65.69C36.18,65.69,31,60,31,53s5-12.74,11.43-12.74S54,45.92,53.89,53,48.84,65.69,42.45,65.69Zm42.24,0C78.41,65.69,73.25,60,73.25,53s5-12.74,11.44-12.74S96.23,45.92,96.12,53,91.08,65.69,84.69,65.69Z"/></svg>
                </div>
            </div>
            <div class="guild-separator"></div>
            <div id="guilds-scroll" class="guilds-scroll"></div>
        </nav>

        <!-- 2. Channels Sidebar -->
        <aside class="channels-sidebar">
            <header class="guild-header">
                <span id="guild-name-title">เซิร์ฟเวอร์</span>
                <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M7 10l5 5 5-5z"/></svg>
            </header>

            <div id="channels-scroller" class="channels-scroller"></div>

            <!-- Self User Bar Bottom Left -->
            <footer class="user-control-bar">
                <div class="user-info-area">
                    <div class="avatar-container">
                        <img id="self-avatar" src="" alt="avatar">
                        <div class="status-dot online"></div>
                    </div>
                    <div class="user-text">
                        <div id="self-display-name" class="name-text">User</div>
                        <div id="self-tag" class="status-text">ออนไลน์</div>
                    </div>
                </div>
                <div class="user-action-buttons">
                    <button class="icon-btn" title="ปิดเสียง"><svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3z"/></svg></button>
                    <button class="icon-btn" title="ปิดหูฟัง"><svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M12 3a9 9 0 0 0-9 9v7c0 1.1.9 2 2 2h3v-8H5v-1c0-3.87 3.13-7 7-7s7 3.13 7 7v1h-3v8h3c1.1 0 2-.9 2-2v-7a9 9 0 0 0-9-9z"/></svg></button>
                    <button class="icon-btn" title="ตั้งค่า"><svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58c.18-.14.23-.41.12-.61l-1.92-3.32c-.12-.22-.37-.29-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54c-.04-.24-.24-.41-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58c-.18.14-.23.41-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"/></svg></button>
                </div>
            </footer>
        </aside>

        <!-- 3. Main Chat Viewport -->
        <main class="chat-viewport">
            <header class="chat-header">
                <span class="channel-hashtag">#</span>
                <span id="chat-title" class="chat-title-text">เลือกช่องทาง</span>
            </header>

            <div id="messages-scroller" class="messages-scroller"></div>

            <div class="chat-input-wrapper">
                <div class="chat-input-box">
                    <button class="attach-btn">+</button>
                    <input type="text" id="chat-input" placeholder="ส่งข้อความ..." disabled>
                </div>
            </div>
        </main>

        <!-- 4. Member List (Right Panel) -->
        <aside id="member-sidebar" class="member-sidebar">
            <div id="member-list-scroller" class="member-list-scroller"></div>
        </aside>

    </div>

    <script src="app.js"></script>
</body>
</html>
