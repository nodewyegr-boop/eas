<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Discord Client</title>
  <link rel="stylesheet" href="styles/discord-darkness.css">
</head>
<body>

  <!-- LOGIN OVERLAY -->
  <div id="login-overlay" style="position:fixed; top:0; left:0; width:100vw; height:100vh; background:#1e1f22; display:flex; align-items:center; justify-content:center; z-index:9999;">
    <div style="background:#313338; padding:32px; border-radius:8px; width:400px; text-align:center; box-shadow:0 8px 24px rgba(0,0,0,0.5);">
      <h2 style="color:#fff; margin-bottom:8px;">เข้าสู่ระบบ Discord Bot</h2>
      <p style="color:#949ba4; font-size:14px; margin-bottom:20px;">กรอก Bot Token เพื่อเข้าใช้งาน Client</p>
      <input type="password" id="bot-token" placeholder="Bot Token" style="width:100%; padding:10px; background:#1e1f22; border:1px solid #2b2d31; border-radius:4px; color:#fff; margin-bottom:16px; outline:none;" />
      <button id="btn-login" style="width:100%; padding:10px; background:#5865f2; color:#fff; border:none; border-radius:4px; font-weight:600; cursor:pointer;">Sign In</button>
      <div id="login-error" style="color:#f23f43; font-size:13px; margin-top:12px;"></div>
    </div>
  </div>

  <!-- MAIN APP -->
  <div id="app" class="app-container" style="display: none;">

    <!-- 1. SERVER SIDEBAR -->
    <nav class="server-sidebar">
      <div class="server-icon-wrapper active">
        <div class="pill-indicator"></div>
        <div class="server-icon" title="Direct Messages">
          <svg width="28" height="20" viewBox="0 0 28 20" fill="currentColor">
            <path d="M23.0212 1.67671C21.3107 0.87968 19.5079 0.318797 17.6584 0C17.4062 0.461719 17.1195 1.0504 16.9185 1.53982C14.9546 1.2454 13.0033 1.2454 11.0667 1.53982C10.8657 1.0504 10.5658 0.461719 10.3267 0C8.4743 0.318797 6.66858 0.882582 4.95806 1.68252C1.5173 6.8809 0.584703 11.9528 1.05263 16.9535"/>
          </svg>
        </div>
      </div>
      <div class="sidebar-divider"></div>
      <div id="guild-list-container"></div>
    </nav>

    <!-- 2. CHANNEL SIDEBAR -->
    <aside class="channel-sidebar">
      <header class="guild-header">
        <span id="guild-title-name">Discord Server</span>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M7 10l5 5 5-5z"/></svg>
      </header>

      <div class="channel-list-wrapper">
        <div class="channel-category">
          <div class="category-header">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor"><path d="M7 10l5 5 5-5z"/></svg>
            <span class="category-title">TEXT CHANNELS</span>
          </div>
          <div class="channel-item active">
            <svg class="channel-icon" viewBox="0 0 24 24" fill="currentColor"><path d="M5.88657 21C5.57547 21 5.3399 20.7189 5.39427 20.4126L6.00001 17H2.59511C2.28401 17 2.04844 16.7189 2.10281 16.4126L2.36948 14.9126C2.40933 14.6883 2.60423 14.5246 2.83151 14.5246H5.56001L6.4489 9.5H3.044L2.7329 2.49733 2.2212 2.60561L2.87228 0.414922H5.56001L6.4489 9.5H3.044Z"/></svg>
            <span>general</span>
          </div>
        </div>

        <div class="channel-category">
          <div class="category-header">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor"><path d="M7 10l5 5 5-5z"/></svg>
            <span class="category-title">VOICE CHANNELS</span>
          </div>
          <div class="channel-item">
            <svg class="channel-icon" viewBox="0 0 24 24" fill="currentColor"><path d="M11.383 3.07904C11.009 2.82504 10.516 2.88704 10.21 3.22104L5.602 8.25004H3C2.448 8.25004 2 8.69804 2 9.25004V14.75C2 15.302 2.448 15.75 3 15.75H5.602L10.21 20.779C10.516 21.113 11.009 21.175 11.383 20.921C11.757 20.667 11.979 20.237 11.979 19.781V4.21904C11.979 3.76304 11.757 3.33304 11.383 3.07904Z"/></svg>
            <span>General Voice</span>
          </div>
        </div>
      </div>

      <!-- USER PANEL -->
      <footer class="user-panel">
        <div class="user-info">
          <div class="avatar-container">
            <img id="user-avatar-img" src="https://cdn.discordapp.com/embed/avatars/0.png" alt="Avatar">
            <div class="status-indicator online"></div>
          </div>
          <div class="user-details">
            <div id="user-display-name" class="username">Bot Name</div>
            <div id="user-display-tag" class="user-tag">#0000</div>
          </div>
        </div>
        <div class="user-controls">
          <button class="icon-btn" title="Mute"><svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3z"/></svg></button>
          <button class="icon-btn" title="Deafen"><svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M12 3a9 9 0 00-9 9v7c0 1.1.9 2 2 2h3a1 1 0 001-1v-6a1 1 0 00-1-1H5v-1a7 7 0 0114 0v1h-3a1 1 0 00-1 1v6a1 1 0 001 1h3a2 2 0 002-2v-7a9 9 0 00-9-9z"/></svg></button>
          <button class="icon-btn" title="Settings"><svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58c.18-.14.23-.41.12-.61l-1.92-3.32c-.12-.22-.37-.29-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54c-.04-.24-.24-.41-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58c-.18.14-.23.41-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"/></svg></button>
        </div>
      </footer>
    </aside>

    <!-- 3. CHAT AREA -->
    <main class="main-content">
      <header class="chat-header">
        <div class="header-channel-info">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="#949ba4"><path d="M5.88657 21C5.57547 21 5.3399 20.7189 5.39427 20.4126L6.00001 17H2.59511C2.28401 17 2.04844 16.7189 2.10281 16.4126L2.36948 14.9126C2.40933 14.6883 2.60423 14.5246 2.83151 14.5246H5.56001L6.4489 9.5H3.044L2.7329 2.49733 2.2212 2.60561L2.87228 0.414922H5.56001L6.4489 9.5H3.044Z"/></svg>
          <h3>general</h3>
          <div class="header-divider"></div>
          <span class="channel-description">Welcome to general chat!</span>
        </div>
        <div class="header-toolbar">
          <div class="search-bar"><input type="text" placeholder="Search" /></div>
        </div>
      </header>

      <div class="messages-container" id="chat-messages"></div>

      <div class="chat-input-container">
        <div class="chat-input-box">
          <input type="text" id="chat-input" placeholder="ส่งข้อความใน #general" />
        </div>
      </div>
    </main>

    <!-- 4. MEMBER LIST -->
    <aside class="member-sidebar">
      <div class="member-group-title">ONLINE — 1</div>
      <div class="member-item">
        <img id="member-bot-img" src="https://cdn.discordapp.com/embed/avatars/0.png" alt="Bot">
        <div class="member-name">
          <span id="member-bot-username">Bot</span>
          <span class="bot-badge">BOT</span>
        </div>
      </div>
    </aside>

  </div>

  <script>
    document.getElementById('btn-login').addEventListener('click', async () => {
      const token = document.getElementById('bot-token').value.trim();
      if (!token) return;

      try {
        const res = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ token })
        });
        const data = await res.json();

        if (data.success) {
          document.getElementById('login-overlay').style.display = 'none';
          document.getElementById('app').style.display = 'flex';

          document.getElementById('user-avatar-img').src = data.user.avatar;
          document.getElementById('user-display-name').innerText = data.user.username;
          document.getElementById('user-display-tag').innerText = `#${data.user.discriminator || '0000'}`;
          document.getElementById('member-bot-img').src = data.user.avatar;
          document.getElementById('member-bot-username').innerText = data.user.username;

          // Render Correct Embed
          const chatMsg = document.getElementById('chat-messages');
          chatMsg.innerHTML = `
            <div class="message-group">
              <img src="${data.user.avatar}" class="message-avatar" />
              <div class="message-content-wrapper">
                <div class="message-header">
                  <span class="message-author">${data.user.username}</span>
                  <span class="bot-badge">BOT</span>
                  <span class="message-timestamp">วันนี้ เวลา ${new Date().toLocaleTimeString('th-TH', {hour:'2-digit', minute:'2-digit'})}</span>
                </div>
                <div class="message-body">เข้าสู่ระบบผ่าน Web Gateway เรียบร้อยแล้ว!</div>
                
                <div class="discord-embed">
                  <div class="embed-title">DISCORD WEB CLIENT READY</div>
                  <div class="embed-description">ระบบพร้อมทำงานในรูปแบบ Discord Desktop Web App เป๊ะ 100%</div>
                </div>
              </div>
            </div>
          `;
        } else {
          document.getElementById('login-error').innerText = data.message;
        }
      } catch (err) {
        document.getElementById('login-error').innerText = 'ไม่สามารถเชื่อมต่อ Server ได้';
      }
    });
  </script>
</body>
</html>
