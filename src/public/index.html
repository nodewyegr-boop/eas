<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Discord Web Client</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'gg sans', sans-serif; }
        body { background-color: #1e1f22; color: #f2f3f5; height: 100vh; overflow: hidden; }
        
        .login-overlay {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: #1e1f22; display: flex; align-items: center; justify-content: center; z-index: 9999;
        }
        .login-box { width: 420px; background: #313338; padding: 32px; border-radius: 8px; box-shadow: 0 8px 16px rgba(0,0,0,0.4); }
        .login-header { text-align: center; margin-bottom: 20px; }
        .login-header h2 { color: #f2f3f5; font-size: 22px; margin-top: 8px; }
        .login-header p { color: #949ba4; font-size: 13px; margin-top: 4px; }
        .form-group { display: flex; flex-direction: column; gap: 8px; margin-bottom: 20px; }
        .form-group label { font-size: 12px; font-weight: bold; color: #b5bac1; text-transform: uppercase; }
        .form-group input { background: #1e1f22; border: 1px solid #111214; padding: 10px; border-radius: 4px; color: #f2f3f5; font-size: 14px; outline: none; }
        .btn-submit { width: 100%; background: #5865f2; color: white; border: none; padding: 12px; border-radius: 4px; font-weight: bold; font-size: 15px; cursor: pointer; }
        .btn-submit:hover { background: #4752c4; }
        .btn-submit:disabled { background: #3b428a; cursor: not-allowed; }
        .error-msg { color: #f23f43; font-size: 13px; margin-bottom: 12px; display: none; word-break: break-word; }

        #app { display: none; width: 100vw; height: 100vh; flex-direction: row; }
        .sidebar { width: 72px; background: #1e1f22; padding: 12px 0; display: flex; flex-direction: column; align-items: center; gap: 12px; }
        .main-content { flex: 1; background: #313338; display: flex; flex-direction: column; padding: 20px; }
        .user-bar { display: flex; align-items: center; gap: 12px; background: #2b2d31; padding: 12px; border-radius: 8px; margin-bottom: 20px; }
        .user-avatar { width: 40px; height: 40px; border-radius: 50%; }
        .guild-icon { width: 48px; height: 48px; border-radius: 50%; object-fit: cover; cursor: pointer; transition: 0.2s; }
        .guild-icon:hover { border-radius: 16px; }
    </style>
</head>
<body>

    <!-- Login Screen -->
    <div id="login-screen" class="login-overlay">
        <div class="login-box">
            <div class="login-header">
                <i class="fa-brands fa-discord" style="font-size: 40px; color: #5865f2;"></i>
                <h2>ยินดีต้อนรับกลับมา!</h2>
                <p>เข้าสู่ระบบด้วย Discord Bot Token</p>
            </div>
            <form id="login-form">
                <div class="form-group">
                    <label>BOT TOKEN</label>
                    <input type="password" id="token-input" placeholder="วาง Discord Bot Token ที่นี่..." required autocomplete="off">
                </div>
                <div id="login-error" class="error-msg"></div>
                <button type="submit" id="login-btn" class="btn-submit">เข้าสู่ระบบ</button>
            </form>
        </div>
    </div>

    <!-- Dashboard -->
    <div id="app">
        <div class="sidebar" id="guild-list"></div>
        <div class="main-content">
            <div class="user-bar">
                <img id="user-avatar" class="user-avatar" src="https://cdn.discordapp.com/embed/avatars/0.png" alt="Avatar">
                <span id="user-tag" style="font-weight: bold;">กำลังโหลด...</span>
            </div>
            <h2>เชื่อมต่อระบบควบคุมบอทสำเร็จ</h2>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="js/app.js"></script>
    <script src="js/socket.js"></script>
</body>
</html>
