<!-- แทรกไว้ใน body ก่อน <div id="app"> -->
<div id="login-screen" class="login-overlay">
    <div class="login-box">
        <div class="login-header">
            <i class="fa-brands fa-discord login-logo"></i>
            <h2>ยินดีต้อนรับกลับมา!</h2>
            <p>เรารู้สึกตื่นเต้นที่จะได้พบคุณอีกครั้ง!</p>
        </div>
        <form id="login-form" onsubmit="UI.handleLogin(event)">
            <div class="form-group">
                <label>DISCORD TOKEN / BOT TOKEN <span class="required">*</span></label>
                <input type="password" id="token-input" placeholder="วาง Discord Token ของคุณที่นี่..." required autocomplete="off">
                <small class="hint-text">Token จะถูกเก็บปลอดภัยใน Browser (localStorage) เท่านั้น</small>
            </div>
            <div id="login-error" class="error-msg" style="display: none;"></div>
            <button type="submit" id="login-btn" class="btn-submit">เข้าสู่ระบบ</button>
        </form>
    </div>
</div>
